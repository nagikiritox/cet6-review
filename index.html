<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LAGOM · CET-6 学习空间</title>
  <meta name="description" content="一个刚刚好的六级备考空间：全真模拟、套题训练、专项练习、背单词与个人数据看板。">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23356859'/%3E%3Cpath d='M20 38c0-9 5.4-16 12-16s12 7 12 16' fill='none' stroke='%23f5f3ee' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='43' r='2.4' fill='%23e8b84b'/%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('lagom-cet6-theme') || 'null') || 'system';
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = p === 'system' ? (dark ? 'dark' : 'light') : p;
        document.documentElement.dataset.themePref = p;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <a class="skip-link" href="#view">跳到主要内容</a>

  <div class="app">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#/home" aria-label="LAGOM CET-6 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="15" fill="currentColor"/>
            <path d="M13 29c0-8 4.9-14 11-14s11 6 11 14" stroke="#F5F3EE" stroke-width="3.4" stroke-linecap="round"/>
            <circle cx="24" cy="33" r="2.2" fill="#E8B84B"/>
          </svg>
        </span>
        <span class="brand-type">
          <strong>LAGOM</strong>
          <small>CET-6 · 学习空间</small>
        </span>
      </a>

      <nav class="side-nav">
        <a href="#/home" data-nav="home"><span class="nav-ico" data-icon="home"></span><span>首页</span></a>
        <a href="#/practice" data-nav="practice"><span class="nav-ico" data-icon="layers"></span><span>刷题</span></a>
        <a href="#/words" data-nav="words"><span class="nav-ico" data-icon="book"></span><span>背单词</span></a>
        <a href="#/stats" data-nav="stats"><span class="nav-ico" data-icon="chart"></span><span>我的数据</span></a>
      </nav>

      <div class="side-bottom">
        <a class="exam-chip" href="#/practice/mock">
          <span class="exam-chip-top"><span data-icon="calendar"></span> 备考倒计时</span>
          <strong id="sideCountdown">— <em>天</em></strong>
          <small id="sideExamDate">2026.12.19 · 六级考试</small>
        </a>
        <div class="theme-switch" role="group" aria-label="外观主题">
          <button type="button" data-theme-choice="system" title="跟随系统"><span data-icon="monitor"></span><span>系统</span></button>
          <button type="button" data-theme-choice="light" title="浅色"><span data-icon="sun"></span><span>浅色</span></button>
          <button type="button" data-theme-choice="dark" title="深色"><span data-icon="moon"></span><span>深色</span></button>
        </div>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-left">
          <span class="crumb-icon" data-icon="compass"></span>
          <span class="crumb-text" id="crumbText">学习空间</span>
        </div>
        <div class="topbar-actions">
          <a class="streak-pill" href="#/stats" title="连续学习天数">
            <span data-icon="flame"></span>
            <b id="topStreak">0</b><span class="streak-label">天连续</span>
          </a>
          <button class="icon-btn theme-quick" type="button" data-action="theme-quick" aria-label="切换深浅色">
            <span data-icon="theme"></span>
          </button>
          <a class="avatar" href="#/stats" aria-label="我的数据">L</a>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <footer class="site-footer">
        <span>LAGOM · CET-6 学习空间</span>
        <span>内置题目为原创模拟内容，导入真题由你自行提供 · 数据保存在本机浏览器</span>
      </footer>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="移动端主导航">
    <a href="#/home" data-nav="home"><span data-icon="home"></span><span>首页</span></a>
    <a href="#/practice" data-nav="practice"><span data-icon="layers"></span><span>刷题</span></a>
    <a href="#/words" data-nav="words"><span data-icon="book"></span><span>背单词</span></a>
    <a href="#/stats" data-nav="stats"><span data-icon="chart"></span><span>数据</span></a>
  </nav>

  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="modalRoot" class="modal-root"></div>

  <script src="data/words.js"></script>
  <script src="data/units-drills.js"></script>
  <script src="data/units-sets.js"></script>
  <script src="data/units-mock.js"></script>
  <script src="data/papers.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/imports.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/practice.js"></script>
  <script src="js/pages/imports.js"></script>
  <script src="js/pages/quiz.js"></script>
  <script src="js/pages/words.js"></script>
  <script src="js/pages/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
